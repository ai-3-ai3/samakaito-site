<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>samakaito</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <div class="container">

      <div class="hero-image"></div>

      <div class="name">samakaito</div>

      <div class="news-ticker">
        <div class="news-track">
          <span>NEW RELEASE "Bathroom" OUT NOW</span>
            <span>•</span>
            <span>BOOKING OPEN</span>
            <span>•</span>
            <span>LATEST LINKS BELOW</span>
            <span>•</span>
        </div>
      </div>

      <div class="role">DJ / Producer</div>

       <div class="socials">
  <a href="https://instagram.com/" class="social-btn" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-instagram"></i>
  </a>

  <a href="https://soundcloud.com/" class="social-btn" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-soundcloud"></i>
  </a>

  <a href="https://tiktok.com/" class="social-btn" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-tiktok"></i>
  </a>

  <a href="https://youtube.com/" class="social-btn" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-youtube"></i>
  </a>
</div>

      <div class="links-wrap">

        <div class="section-title">Links</div>

        <div class="link-card">
          <div class="thumb"></div>
          <div class="card-text">
            <div class="card-title">Website</div>
            <div class="card-sub">公式サイト</div>
          </div>
        </div>

        <div class="link-card">
          <div class="thumb"></div>
          <div class="card-text">
            <div class="card-title">Latest Track</div>
            <div class="card-sub">最新曲</div>
          </div>
        </div>

        <div class="link-card">
          <div class="thumb"></div>
          <div class="card-text">
            <div class="card-title">Music Video</div>
            <div class="card-sub">MV</div>
          </div>
        </div>

        <div class="link-card">
          <div class="thumb"></div>
          <div class="card-text">
            <div class="card-title">Booking</div>
            <div class="card-sub">出演依頼</div>
          </div>
        </div>

        <div class="link-card">
          <div class="thumb"></div>
          <div class="card-text">
            <div class="card-title">Merch</div>
            <div class="card-sub">グッズ</div>
          </div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
