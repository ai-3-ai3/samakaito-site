<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMAKAiTO | DJ</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#0a0a0a;
color:white;
}

.page{
min-height:100vh;

background:
linear-gradient(
180deg,
#9cffc7 0%,
#4fe08d 30%,
#1fbf75 60%,
#0f7a4c 100%
);

padding:30px 15px;
}

.container{
max-width:420px;
margin:auto;
text-align:center;
}

.hero-image{
height:320px;
border-radius:30px;
background:
linear-gradient(
135deg,
#baffdb,
#47d98c,
#0d7a49
);

margin-bottom:20px;
}

.name{
font-size:42px;
font-weight:bold;
margin:10px 0;
}

.role{
font-size:18px;
opacity:.9;
}

.intro{
font-size:14px;
margin-top:10px;
opacity:.9;
}

.socials{
display:flex;
justify-content:center;
gap:10px;
margin-top:20px;
}

.social-btn{
width:50px;
height:50px;
border-radius:50%;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

.links-wrap{
margin-top:30px;
background:rgba(255,255,255,0.1);
border-radius:25px;
padding:15px;
}

.section-title{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
}

.link-card{
display:flex;
background:white;
color:black;
border-radius:20px;
overflow:hidden;
margin-bottom:12px;
}

.thumb{
width:90px;
background:linear-gradient(135deg,#0d7a49,#1fbf75);
}

.card-text{
padding:15px;
flex:1;
}

.card-title{
font-weight:bold;
}

.card-sub{
font-size:12px;
color:#555;
}

</style>

</head>

<body>

<div class="page">

<div class="container">

<div class="hero-image"></div>

<div class="name">SAMAKAiTO</div>

<div class="role">DJ / Producer</div>

<div class="intro">
DJ向けリンクまとめページのデモサイト
</div>

<div class="socials">
<div class="social-btn">IG</div>
<div class="social-btn">SC</div>
<div class="social-btn">TT</div>
<div class="social-btn">YT</div>
</div>

<div class="links-wrap">

<div class="section-title">Links</div>

<div class="link-card">
<div class="thumb"></div>
<div class="card-text">
<div class="card-title">Website</div>
<div class="card-sub">公式サイト</div>
</div>
</div>

<div class="link-card">
<div class="thumb"></div>
<div class="card-text">
<div class="card-title">Latest Track</div>
<div class="card-sub">最新曲</div>
</div>
</div>

<div class="link-card">
<div class="thumb"></div>
<div class="card-text">
<div class="card-title">Music Video</div>
<div class="card-sub">MV</div>
</div>
</div>

<div class="link-card">
<div class="thumb"></div>
<div class="card-text">
<div class="card-title">Booking</div>
<div class="card-sub">出演依頼</div>
</div>
</div>

<div class="link-card">
<div class="thumb"></div>
<div class="card-text">
<div class="card-title">Merch</div>
<div class="card-sub">グッズ</div>
</div>
</div>

</div>

</div>

</div>

</body>
</html>
